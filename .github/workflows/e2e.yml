name: Mobile end-to-end

# Run the Maestro flows in mobile/maestro/flows:
# - web: the same flows in Chromium, against the web build. Fast.
# - android: a release build on an Android emulator.
# - ios: a release build on an iOS simulator.
# Each job uploads its screenshots and a JUnit report.
on:
  pull_request:
    paths: ['mobile/**', 'src/utils/**', 'src/constants/**', '.github/workflows/e2e.yml']
  push:
    branches: [master]
    paths: ['mobile/**', 'src/utils/**', 'src/constants/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The test build: the seed link and the fixed clock work only with this.
  EXPO_PUBLIC_E2E: '1'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  APP_ID: com.lukeboyle.debtdestroyer

defaults:
  run:
    working-directory: mobile

jobs:
  web:
    # Playwright 1.56 has no Chromium for Ubuntu 26.04, the new ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx expo export --platform web --output-dir dist-e2e
      - run: node e2e-web/run.mjs dist-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-web
          path: mobile/maestro-output/web

  android:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release APK (x86_64 only, for the emulator)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: mobile
          # A slow emulator can show "Pixel Launcher isn't responding" over the
          # app. Hide such dialogs, so that Maestro sees the app.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test -e APP_ID=$APP_ID -e LINK=debtdestroyer:// --format junit --output maestro-output/android.xml --test-output-dir maestro-output/android maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: mobile/maestro-output

  ios:
    needs: web
    # Expo SDK 58 builds with Xcode 27, which macos-15 does not have.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The default Xcode of the runner can be older than the newest one.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcrun swift --version
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build the release app for the simulator
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Start a simulator, and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/*.app
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows on the iOS simulator
        run: maestro --device "$UDID" test -e APP_ID=$APP_ID -e LINK=debtdestroyer:// --format junit --output maestro-output/ios.xml --test-output-dir maestro-output/ios maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios
          path: mobile/maestro-output
