# Start the app, and load a test scenario (src/e2e/scenarios.ts).
# Each scenario also fixes the clock to November 2026.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
# Wait for the first screen. On Android, a link that comes before the app
# loads its JavaScript is lost.
- extendedWaitUntil:
    visible: { id: about-button }
    timeout: 30000
- openLink: ${LINK}e2e/seed?scenario=${SCENARIO}
# iOS asks before it opens a link in the app. The question can come after a
# delay, and it stays on the screen and covers the app in the next flows too.
# So wait for it on iOS, but do not fail if it does not come.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Open'
          optional: true
- waitForAnimationToEnd
