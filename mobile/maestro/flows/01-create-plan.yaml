appId: ${APP_ID}
name: Create a plan and start it
tags: [plan]
---
- runFlow:
    file: ../common/seed.yaml
    env:
      SCENARIO: empty
- assertVisible: "No debts yet"

# The first debt.
- tapOn:
    id: plan-add-debt
- tapOn:
    id: debt-name
- inputText: "Credit card"
- tapOn:
    id: debt-balance
- inputText: "4500"
- tapOn:
    id: debt-rate
- inputText: "19.9"
- tapOn:
    id: debt-repayment
- inputText: "150"
- runFlow: ../common/hide-keyboard.yaml
- tapOn:
    id: debt-done

# The second debt.
- tapOn:
    id: plan-add-debt
- tapOn:
    id: debt-name
- inputText: "Car loan"
- tapOn:
    id: debt-balance
- inputText: "12000"
- tapOn:
    id: debt-rate
- inputText: "7.5"
- tapOn:
    id: debt-repayment
- inputText: "320"
- runFlow: ../common/hide-keyboard.yaml
- tapOn:
    id: debt-done

- assertVisible: "Credit card"
- assertVisible: "Car loan"
- assertVisible: "Debt free by"
- tapOn: "Avalanche"

- scrollUntilVisible:
    centerElement: true
    element:
      id: plan-extra
- tapOn:
    id: plan-extra
- inputText: "200"
- runFlow: ../common/hide-keyboard.yaml

- scrollUntilVisible:
    centerElement: true
    element:
      id: plan-start
- assertVisible: "Start in November 2026"
- tapOn:
    id: plan-start
- assertVisible: "November 2026 is ready to reconcile"
- takeScreenshot: 01-plan-started
