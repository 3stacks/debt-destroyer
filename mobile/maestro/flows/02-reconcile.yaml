appId: ${APP_ID}
name: Reconcile a month with the actual payments
tags: [tracking]
---
- runFlow:
    file: ../common/seed.yaml
    env:
      SCENARIO: started
- assertVisible: "November 2026 is ready to reconcile"
- tapOn:
    id: track-reconcile
- assertVisible: "How much did you actually pay.*"

# An empty field stops the save.
- scrollUntilVisible:
    centerElement: true
    element:
      id: reconcile-save
- tapOn:
    id: reconcile-save
- assertVisible: "Enter what you paid"
- tapOn: "OK"

# Pay as planned, then pay less on the car loan.
- scrollUntilVisible:
    centerElement: true
    element:
      id: reconcile-planned
    direction: UP
- tapOn:
    id: reconcile-planned
- tapOn:
    id: paid-car
- eraseText
- inputText: "200"
- runFlow: ../common/hide-keyboard.yaml
- assertVisible: "Under the plan"
- scrollUntilVisible:
    centerElement: true
    element:
      id: reconcile-save
- tapOn:
    id: reconcile-save

- scrollUntilVisible:
    centerElement: true
    element:
      text: "November 2026"
- assertVisible: "Paid .* of .* planned"
# The totals are at the top. On a phone, the list scrolls them off the screen.
- scrollUntilVisible:
    centerElement: true
    element:
      text: "Under the plan"
    direction: UP
- takeScreenshot: 02-reconciled
