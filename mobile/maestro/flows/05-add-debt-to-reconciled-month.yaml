appId: ${APP_ID}
name: Add a debt to a month that is already reconciled
tags: [revision]
---
- runFlow:
    file: ../common/seed.yaml
    env:
      SCENARIO: reconciled-november
- scrollUntilVisible:
    element:
      id: track-revise
- tapOn:
    id: track-revise
- assertVisible: "November 2026 is already reconciled.*"

- scrollUntilVisible:
    element:
      id: plan-add-debt
- tapOn:
    id: plan-add-debt
- tapOn:
    id: debt-name
- inputText: "Pay later"
- tapOn:
    id: debt-balance
- inputText: "600"
- tapOn:
    id: debt-rate
- inputText: "0"
- tapOn:
    id: debt-repayment
- inputText: "50"
- hideKeyboard
- tapOn:
    id: debt-done
- scrollUntilVisible:
    element:
      id: revise-save
- tapOn:
    id: revise-save

# The reconciliation of November opens, with the new debt in it.
- assertVisible: "Pay later"
- tapOn:
    id: reconcile-planned
- scrollUntilVisible:
    element:
      id: reconcile-save
- tapOn:
    id: reconcile-save
- assertNotVisible: "A debt has no amount.*"
- assertVisible: "Pay later"
- takeScreenshot: 05-debt-added
